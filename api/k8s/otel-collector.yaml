apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch: { timeout: 5s, send_batch_size: 512 }
      resourcedetection: { detectors: [env, system, k8snode] }
    exporters:
      # kafka-bridge is a Python sidecar that receives OTLP/HTTP JSON and
      # forwards to Azure Event Hub using kafka-python (which sends ApiVersionsRequest
      # before SASL, unlike Sarama which causes a connection reset from EH).
      otlphttp/bridge:
        endpoint: http://kafka-bridge:4319
        encoding: json
        tls:
          insecure: true
        timeout: 15s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s
      debug: { verbosity: basic }
    service:
      pipelines:
        logs:    { receivers: [otlp], processors: [batch, resourcedetection], exporters: [otlphttp/bridge] }
        traces:  { receivers: [otlp], processors: [batch, resourcedetection], exporters: [otlphttp/bridge] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels: { app: otel-collector }
spec:
  replicas: 2
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.127.0
          args: ["--config=/conf/collector.yaml"]
          env:
            - { name: K8S_CLUSTER_NAME, value: "REPLACE_AKS_NAME" }
            # Required by the k8snode resource detector to identify the node the collector runs on.
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
          volumeMounts: [{ name: cfg, mountPath: /conf }]
      volumes:
        - name: cfg
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
