apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch: { timeout: 5s, send_batch_size: 512 }
      resourcedetection: { detectors: [env, system, k8snode] }
    exporters:
      kafka/logs:
        brokers: ["${env:EVENTHUB_NAMESPACE_BOOTSTRAP}"]
        topic: aks-otel
        encoding: otlp_json
        protocol_version: 2.0.0
        auth:
          sasl: { mechanism: PLAIN, username: "$ConnectionString", password: "${env:EVENTHUB_CONNSTR_LOGS}" }
          tls:  { insecure: false }
      kafka/traces:
        brokers: ["${env:EVENTHUB_NAMESPACE_BOOTSTRAP}"]
        topic: aks-otel
        encoding: otlp_json
        protocol_version: 2.0.0
        auth:
          sasl: { mechanism: PLAIN, username: "$ConnectionString", password: "${env:EVENTHUB_CONNSTR_LOGS}" }
          tls:  { insecure: false }
      debug: { verbosity: basic }
    service:
      pipelines:
        logs:    { receivers: [otlp], processors: [batch, resourcedetection], exporters: [kafka/logs] }
        traces:  { receivers: [otlp], processors: [batch, resourcedetection], exporters: [kafka/traces] }
---
apiVersion: v1
kind: Secret
metadata:
  name: otel-collector-secret
  namespace: observability
type: Opaque
stringData:
  EVENTHUB_NAMESPACE_BOOTSTRAP: "REPLACE_EHNS.servicebus.windows.net:9093"
  # Connection string with SendOnly auth for the `aks-otel` hub. Created by 30-deploy-aks.sh.
  EVENTHUB_CONNSTR_LOGS: "REPLACE_EH_CONNSTR"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels: { app: otel-collector }
spec:
  replicas: 2
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.108.0
          args: ["--config=/conf/collector.yaml"]
          envFrom: [{ secretRef: { name: otel-collector-secret } }]
          env:
            - { name: K8S_CLUSTER_NAME, value: "REPLACE_AKS_NAME" }
          ports:
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
          volumeMounts: [{ name: cfg, mountPath: /conf }]
      volumes:
        - name: cfg
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
